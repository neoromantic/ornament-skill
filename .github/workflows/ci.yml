# CI for the skill: ruff, the offline unittest suite (which also checks the SKILL.md
# frontmatter) on the oldest and newest supported Python, and devkit's hygiene checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: neoromantic/devkit/.github/workflows/ci-python.yml@v1
    permissions:
      contents: read
    with:
      python-version: '["3.10", "3.14"]'
      test-command: python -m unittest discover -s tests -v

  hygiene:
    uses: neoromantic/devkit/.github/workflows/hygiene.yml@v1
    permissions:
      contents: read

  # The one check to require in a branch ruleset. It is named exactly "ci".
  ci:
    needs: [build, hygiene]
    if: always() && github.event.pull_request.draft != true
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    permissions: {}
    steps:
      - name: All jobs passed
        # A step `if:` without a status function implies success(), which is false once
        # a needed job failed, so without always() the step is skipped and the gate passes.
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
